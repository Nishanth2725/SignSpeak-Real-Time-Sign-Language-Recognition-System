<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignSpeak - Settings</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">SignSpeak</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="settings.html" class="active">Settings</a></li>
        </ul>
        <div class="auth-buttons" id="nav-auth-section"></div>
    </nav>

    <div class="container">
        <h2 style="margin-bottom: 2rem;">Settings</h2>
        
        <div class="glass-card" style="max-width: 600px;">
            <div class="form-group">
                <label>Confidence Threshold (%)</label>
                <input type="range" id="conf-threshold" min="50" max="99" value="80" style="width: 100%; margin: 1rem 0;">
                <span id="conf-value" style="color: var(--primary-color);">80%</span>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">Gestures below this confidence will be ignored.</p>
            </div>

            <div class="form-group" style="margin-top: 2rem;">
                <label style="display: flex; align-items: center; gap: 1rem; cursor: pointer;">
                    <input type="checkbox" id="show-landmarks" checked style="width: 20px; height: 20px;">
                    Show Hand Landmarks Overlay
                </label>
            </div>

            <div class="form-group" style="margin-top: 2rem;">
                <label style="display: flex; align-items: center; gap: 1rem; cursor: pointer;">
                    <input type="checkbox" id="auto-speak" style="width: 20px; height: 20px;">
                    Auto-Speak Recognized Words
                </label>
            </div>

            <button onclick="saveSettings()" class="btn btn-primary" style="margin-top: 2rem;">Save Settings</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const slider = document.getElementById('conf-threshold');
        const display = document.getElementById('conf-value');

        slider.addEventListener('input', (e) => {
            display.innerText = e.target.value + '%';
        });

        function loadSettings() {
            const savedConf = localStorage.getItem('confThreshold') || 80;
            const showLandmarks = localStorage.getItem('showLandmarks') !== 'false';
            const autoSpeak = localStorage.getItem('autoSpeak') === 'true';

            slider.value = savedConf;
            display.innerText = savedConf + '%';
            document.getElementById('show-landmarks').checked = showLandmarks;
            document.getElementById('auto-speak').checked = autoSpeak;
        }

        function saveSettings() {
            localStorage.setItem('confThreshold', slider.value);
            localStorage.setItem('showLandmarks', document.getElementById('show-landmarks').checked);
            localStorage.setItem('autoSpeak', document.getElementById('auto-speak').checked);
            alert('Settings saved!');
        }

        loadSettings();
    </script>
</body>
</html>
